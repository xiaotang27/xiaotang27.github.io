<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Xiaotang27 的博客归档：按发布年月分组，可按标签查找。" />
  <title>博客 · Xiaotang27</title>
  <link rel="icon" type="image/webp" href="xiaotang27-logo.webp" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="assets/blog.css?v=2" />
</head>
<body>
  <!-- 顶部毛玻璃区域：时刻显示 -->
  <header class="glass">
    <div class="glass-inner">
      <a class="glass-brand" href="index.html">
        <img src="xiaotang27-logo.webp" alt="Xiaotang27" />
        <span>
          <span class="gb-name">Xiaotang27</span>
          <span class="gb-sub">丢掉幻想，准备斗争</span>
        </span>
      </a>
      <nav class="glass-nav" aria-label="站点导航">
        <a href="index.html">主页</a>
        <a href="blog.html" aria-current="page">博客</a>
        <a href="friends.html">友链</a>
        <a href="post.html?post=about">关于</a>
      </nav>
    </div>
  </header>

  <main class="b-page">
    <h1 class="b-title">博客</h1>
    <p class="b-sub">按发布年月归档；上方可搜索正文，右侧可按标签 / 时间筛选。</p>

    <div class="b-main">
      <div class="b-posts">
        <!-- 站内搜索：标题 / 正文 / 标签 -->
        <div class="b-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="搜索文章标题或正文内容…" autocomplete="off" aria-label="搜索文章" />
          <button id="searchClear" class="b-clear" type="button" aria-label="清空搜索" hidden>×</button>
        </div>
        <div class="b-search-meta" id="searchMeta" hidden></div>

        <div class="b-status" id="status">正在加载文章…</div>
        <div id="groups"></div>
      </div>

      <aside class="b-side">
        <h3 class="b-side-title">按标签查找</h3>
        <div class="tag-list" id="tagList"></div>

        <h3 class="b-side-title" style="margin-top:24px">按时间查找</h3>
        <select id="monthSelect" class="month-select">
          <option value="">全部时间</option>
        </select>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    © <span id="year">2025</span> Xiaotang27 · 保留所有权利 ·
    <a href="https://icp.gov.moe/?keyword=20265735" target="_blank" rel="noopener">萌ICP备20265735号</a>
  </footer>

  <script src="assets/markdown.js"></script>
  <script>
    (function () {
      var posts = [];
      var activeTag = null;
      var activeMonth = '';
      var query = new URLSearchParams(location.search).get('q') || '';

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function escRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
      function lastModifiedDate(res) {
        var lm = res && res.headers && res.headers.get('Last-Modified');
        if (!lm) return '';
        var d = new Date(lm);
        return isNaN(d) ? '' : d.toISOString().slice(0, 10);
      }
      function ym(p) { return (p.date || '').slice(0, 7); }

      /* ---------- 搜索：正文纯文本 / 关键词匹配 / 命中摘要 ---------- */
      function plainText(md) {
        return String(md || '')
          .replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, ' ')
          .replace(/```[\s\S]*?```/g, ' ')
          .replace(/`([^`]*)`/g, ' $1 ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
          .replace(/\[([^\]]*)\]\([^)]*\)/g, ' $1 ')
          .replace(/<[^>]+>/g, ' ')
          .replace(/[#>*_~`|]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }
      function terms() {
        return String(query || '').toLowerCase().split(/\s+/).filter(Boolean);
      }
      function matchesQuery(p, ts) {
        if (!ts.length) return true;
        var h = ((p.title || '') + ' ' + (p.desc || '') + ' ' + (p.tags || []).join(' ') +
          ' ' + (p.plain || '')).toLowerCase();
        return ts.every(function (t) { return h.indexOf(t) > -1; });
      }
      function snippetOf(p, ts) {
        var text = p.plain || '';
        var lower = text.toLowerCase();
        var at = -1;
        for (var i = 0; i < ts.length; i++) {
          var j = lower.indexOf(ts[i]);
          if (j > -1 && (at === -1 || j < at)) at = j;
        }
        if (at === -1) return '';
        var start = Math.max(0, at - 34);
        var end = Math.min(text.length, at + 78);
        return (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
      }
      function mark(s, ts) {
        var html = esc(s);
        ts.forEach(function (t) {
          if (!t) return;
          html = html.replace(new RegExp(escRe(t), 'gi'), function (m) { return '<mark>' + m + '</mark>'; });
        });
        return html;
      }

      function load() {
        return fetch('posts/index.json')
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (data) {
            posts = (data.posts || []).slice();
            return Promise.all(posts.map(function (p) {
              return fetch('posts/' + encodeURIComponent(p.slug) + '.md')
                .then(function (res) {
                  var d = lastModifiedDate(res);
                  return res.text().then(function (md) {
                    p.date = p.date || d;
                    p.words = countWords(md);
                    p.plain = plainText(md);   // 供全文搜索使用
                    return p;
                  });
                })
                .catch(function () { p.words = 0; p.plain = ''; return p; });
            }));
          })
          .then(function () {
            posts.sort(function (a, b) {
              if ((b.date || '') !== (a.date || '')) return (b.date || '').localeCompare(a.date || '');
              return 0;
            });
          });
      }

      function renderTagList() {
        var counts = {};
        var order = [];
        posts.forEach(function (p) {
          (p.tags || []).forEach(function (t) {
            if (!counts[t]) { counts[t] = 0; order.push(t); }
            counts[t]++;
          });
        });
        order.sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); });

        var html = '<button type="button" class="tag-item' + (!activeTag ? ' is-active' : '') + '" data-tag="">' +
          '全部文章<span class="tag-count">' + posts.length + '</span></button>';
        html += order.map(function (t) {
          return '<button type="button" class="tag-item' + (activeTag === t ? ' is-active' : '') + '" data-tag="' + esc(t) + '">' +
            esc(t) + '<span class="tag-count">' + counts[t] + '</span></button>';
        }).join('');
        document.getElementById('tagList').innerHTML = html;
      }

      function renderTimeSelect() {
        var keys = {};
        posts.forEach(function (p) { if (ym(p)) keys[ym(p)] = true; });
        var months = Object.keys(keys).sort(function (a, b) { return b.localeCompare(a); });
        var html = '<option value="">全部时间</option>' + months.map(function (m) {
          return '<option value="' + m + '"' + (activeMonth === m ? ' selected' : '') + '>' + m + '</option>';
        }).join('');
        var sel = document.getElementById('monthSelect');
        sel.innerHTML = html;
        sel.value = activeMonth;
      }

      function renderGroups() {
        var ts = terms();
        var list = posts;
        if (activeTag) {
          list = list.filter(function (p) { return (p.tags || []).indexOf(activeTag) > -1; });
        }
        if (activeMonth) {
          list = list.filter(function (p) { return ym(p) === activeMonth; });
        }
        if (ts.length) {
          list = list.filter(function (p) { return matchesQuery(p, ts); });
        }

        // 搜索结果提示
        var meta = document.getElementById('searchMeta');
        if (ts.length) {
          meta.hidden = false;
          meta.textContent = '在标题与正文中找到 ' + list.length + ' 篇包含「' + query.trim() + '」的文章';
        } else {
          meta.hidden = true;
          meta.textContent = '';
        }

        var groups = {};
        list.forEach(function (p) {
          var k = ym(p) || '未知时间';
          (groups[k] = groups[k] || []).push(p);
        });
        var keys = Object.keys(groups).sort(function (a, b) { return b.localeCompare(a); });
        var box = document.getElementById('groups');
        if (!list.length) {
          box.innerHTML = '<div class="b-status">' +
            (ts.length ? '没有找到包含该关键词的文章。' : '没有匹配的文章。') + '</div>';
          return;
        }
        box.innerHTML = keys.map(function (k) {
          var cards = groups[k].map(function (p) {
            var tags = (p.tags || []).map(function (t) {
              return '<span class="tag">' + esc(t) + '</span>';
            }).join('');
            var snip = ts.length ? snippetOf(p, ts) : '';
            return (
              '<a class="b-card" href="post.html?post=' + encodeURIComponent(p.slug) + '">' +
                '<div class="bc-title">' + (ts.length ? mark(p.title, ts) : esc(p.title)) + '</div>' +
                '<div class="bc-meta"><span>' + esc(p.date || '日期未知') + '</span>' +
                (p.words ? '<span>约 ' + formatWords(p.words) + '</span>' : '') +
                (tags ? tags : '') +
                '</div>' +
                (snip ? '<div class="bc-snippet">' + mark(snip, ts) + '</div>' : '') +
              '</a>'
            );
          }).join('');
          return '<section class="b-group"><h3 class="b-group-title">' + esc(k) +
            '<span class="g-count">共 ' + groups[k].length + ' 篇</span></h3>' + cards + '</section>';
        }).join('');
      }

      function bindTags() {
        document.getElementById('tagList').addEventListener('click', function (e) {
          var btn = e.target.closest ? e.target.closest('.tag-item') : null;
          if (!btn || !document.getElementById('tagList').contains(btn)) return;
          var t = btn.getAttribute('data-tag');
          activeTag = (activeTag === t) ? null : t; // 再点一次取消筛选
          renderTagList();
          renderGroups();
        });
      }

      /* ---------- 搜索框 ---------- */
      function bindSearch() {
        var input = document.getElementById('searchInput');
        var clear = document.getElementById('searchClear');
        var timer = null;

        function syncUrl() {
          var q = query.trim();
          var url = q ? '?q=' + encodeURIComponent(q) : location.pathname;
          if (window.history && history.replaceState) history.replaceState(null, '', url);
        }
        function apply(v) {
          query = v;
          clear.hidden = !v;
          if (timer) clearTimeout(timer);
          timer = setTimeout(function () { renderGroups(); syncUrl(); }, 140);
        }

        input.value = query;
        clear.hidden = !query;
        input.addEventListener('input', function () { apply(input.value); });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') { input.value = ''; apply(''); }
        });
        clear.addEventListener('click', function () { input.value = ''; apply(''); input.focus(); });
      }

      load()
        .then(function () {
          document.getElementById('status').style.display = 'none';
          renderTagList();
          renderTimeSelect();
          renderGroups();
          bindTags();
          bindSearch();
          document.getElementById('monthSelect').addEventListener('change', function () {
            activeMonth = this.value;
            renderGroups();
          });
        })
        .catch(function (err) {
          document.getElementById('status').textContent = '文章加载失败：' + err.message +
            '。博客需要读取本地文件，请用 HTTP 服务访问（例如 python -m http.server），或部署后浏览。';
        });

      var yEl = document.getElementById('year');
      if (yEl) yEl.textContent = new Date().getFullYear();
    })();
  </script>

  <script src="assets/backtop.js"></script>
  <script src="assets/theme.js"></script>
  <script src="assets/island.js"></script>
  <script src="assets/search.js"></script>
</body>
</html>
