<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Xiaotang27 的文章索引：按年月归档，可搜索正文、按标签或月份筛选。" />
  <meta name="theme-color" content="#f4f0e6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
  <title>文章 · Xiaotang27</title>
  <link rel="icon" type="image/webp" href="xiaotang27-logo.webp" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="assets/site.css?v=1" />
  <script src="assets/theme.js?v=1"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-in">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="assets/xiaotang27-logo.webp" alt="" width="26" height="26" />
        <span class="brand-name">Xiaotang27</span>
      </a>
      <nav class="nav" aria-label="站点导航">
        <a href="index.html">主页</a>
        <a href="blog.html" aria-current="page">文章</a>
        <a href="friends.html">友链</a>
        <a href="post.html?post=about">关于</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
    </div>
  </header>

  <main class="wrap page">
    <header class="page-head">
      <p class="eyebrow">Index / <span id="yearRange">—</span></p>
      <h1 class="page-title">文章</h1>
      <p class="page-deck">按年月归档。可以搜正文，也可以按标签或月份筛。</p>
    </header>

    <div class="index-search">
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="searchInput" type="search" placeholder="搜索标题或正文…" autocomplete="off" aria-label="搜索文章" />
        <button id="searchClear" class="search-clear" type="button" aria-label="清空搜索" hidden>×</button>
      </div>
      <p class="search-meta" id="searchMeta" hidden></p>
    </div>

    <div class="index-layout">
      <aside class="side" aria-label="筛选">
        <section class="side-block">
          <h2 class="side-title">标签</h2>
          <div class="tag-list" id="tagList"></div>
          <p class="tag-hint">点一下筛选，再点取消。</p>
        </section>
        <section class="side-block">
          <h2 class="side-title">月份</h2>
          <div class="select-wrap">
            <select id="monthSelect" class="select">
              <option value="">全部月份</option>
            </select>
          </div>
        </section>
        <section class="side-block">
          <p class="side-note">共 <b id="totalCount">—</b> 篇<br /><b id="firstDate">—</b> 起，最近 <b id="lastDate">—</b>。</p>
        </section>
      </aside>

      <div class="index-main">
        <p class="status" id="status">正在读取文章…</p>
        <noscript><p class="status">文章列表需要 JavaScript 才能读取。</p></noscript>
        <div id="groups"></div>
      </div>
    </div>
  </main>

  <footer class="site-foot">
    <div class="foot-in">
      <p>© <span id="year">2026</span> Xiaotang27 · 保留所有权利 · <a href="https://icp.gov.moe/?keyword=20265735" target="_blank" rel="noopener">萌ICP备20265735号</a></p>
    </div>
  </footer>

  <script src="assets/markdown.js?v=1"></script>
  <script>
    (function () {
      var posts = [];
      var activeTag = null;
      var activeMonth = '';
      var query = new URLSearchParams(location.search).get('q') || '';

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function escRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
      function dotted(d) { return String(d || '').replace(/-/g, '.'); }
      function lastModifiedDate(res) {
        var lm = res && res.headers && res.headers.get('Last-Modified');
        if (!lm) return '';
        var d = new Date(lm);
        return isNaN(d) ? '' : d.toISOString().slice(0, 10);
      }
      function ym(p) { return (p.date || '').slice(0, 7); }

      function plainText(md) {
        return String(md || '')
          .replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, ' ')
          .replace(/```[\s\S]*?```/g, ' ')
          .replace(/`([^`]*)`/g, ' $1 ')
          .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
          .replace(/\[([^\]]*)\]\([^)]*\)/g, ' $1 ')
          .replace(/<[^>]+>/g, ' ')
          .replace(/[#>*_~`|]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }
      function terms() {
        return String(query || '').toLowerCase().split(/\s+/).filter(Boolean);
      }
      function matchesQuery(p, ts) {
        if (!ts.length) return true;
        var hay = ((p.title || '') + ' ' + (p.desc || '') + ' ' + (p.tags || []).join(' ') +
          ' ' + (p.plain || '')).toLowerCase();
        return ts.every(function (t) { return hay.indexOf(t) > -1; });
      }
      function snippetOf(p, ts) {
        var text = p.plain || '';
        var lower = text.toLowerCase();
        var at = -1;
        for (var i = 0; i < ts.length; i++) {
          var j = lower.indexOf(ts[i]);
          if (j > -1 && (at === -1 || j < at)) at = j;
        }
        if (at === -1) return '';
        var start = Math.max(0, at - 34);
        var end = Math.min(text.length, at + 78);
        return (start > 0 ? '…' : '') + text.slice(start, end) + (end < text.length ? '…' : '');
      }
      function mark(s, ts) {
        var html = esc(s);
        ts.forEach(function (t) {
          if (!t) return;
          html = html.replace(new RegExp(escRe(t), 'gi'), function (m) { return '<mark>' + m + '</mark>'; });
        });
        return html;
      }

      function load() {
        return fetch('posts/index.json')
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (data) {
            posts = (data.posts || []).slice();
            return Promise.all(posts.map(function (p) {
              return fetch('posts/' + encodeURIComponent(p.slug) + '.md')
                .then(function (res) {
                  var d = lastModifiedDate(res);
                  return res.text().then(function (md) {
                    md = md.replace(/^#\s+[^\n]*\n?/, '');
                    p.date = p.date || d;
                    p.words = countWords(md);
                    p.plain = plainText(md);
                    return p;
                  });
                })
                .catch(function () { p.words = 0; p.plain = ''; return p; });
            }));
          })
          .then(function () {
            posts.sort(function (a, b) {
              return String(b.date || '').localeCompare(String(a.date || ''));
            });
          });
      }

      function renderSummary() {
        var dates = posts.map(function (p) { return p.date; }).filter(Boolean).sort();
        var yearRange = document.getElementById('yearRange');
        var total = document.getElementById('totalCount');
        if (dates.length) {
          var minY = dates[0].slice(0, 4);
          var maxY = dates[dates.length - 1].slice(0, 4);
          yearRange.textContent = minY === maxY ? minY : minY + '—' + maxY;
          document.getElementById('firstDate').textContent = dotted(dates[0]);
          document.getElementById('lastDate').textContent = dotted(dates[dates.length - 1]);
        } else {
          yearRange.textContent = '文章索引';
        }
        if (total) total.textContent = posts.length;
      }

      function renderTagList() {
        var counts = {};
        var order = [];
        posts.forEach(function (p) {
          (p.tags || []).forEach(function (t) {
            if (!counts[t]) { counts[t] = 0; order.push(t); }
            counts[t]++;
          });
        });
        order.sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); });

        var html = '<button type="button" class="tag-row' + (!activeTag ? ' is-active' : '') + '" data-tag="">' +
          '<span>全部</span><span class="leader"></span><span class="count">' + posts.length + '</span></button>';
        html += order.map(function (t) {
          return '<button type="button" class="tag-row' + (activeTag === t ? ' is-active' : '') + '" data-tag="' + esc(t) + '">' +
            '<span>' + esc(t) + '</span><span class="leader"></span><span class="count">' + counts[t] + '</span></button>';
        }).join('');
        document.getElementById('tagList').innerHTML = html;
      }

      function renderTimeSelect() {
        var keys = {};
        posts.forEach(function (p) { if (ym(p)) keys[ym(p)] = true; });
        var months = Object.keys(keys).sort(function (a, b) { return b.localeCompare(a); });
        var html = '<option value="">全部月份</option>' + months.map(function (m) {
          return '<option value="' + m + '"' + (activeMonth === m ? ' selected' : '') + '>' + m.replace('-', '.') + '</option>';
        }).join('');
        var sel = document.getElementById('monthSelect');
        sel.innerHTML = html;
        sel.value = activeMonth;
      }

      function renderGroups() {
        var ts = terms();
        var list = posts;
        if (activeTag) {
          list = list.filter(function (p) { return (p.tags || []).indexOf(activeTag) > -1; });
        }
        if (activeMonth) {
          list = list.filter(function (p) { return ym(p) === activeMonth; });
        }
        if (ts.length) {
          list = list.filter(function (p) { return matchesQuery(p, ts); });
        }

        var meta = document.getElementById('searchMeta');
        if (ts.length) {
          meta.hidden = false;
          meta.textContent = '在标题与正文里找到 ' + list.length + ' 篇包含「' + query.trim() + '」的文章';
        } else {
          meta.hidden = true;
          meta.textContent = '';
        }

        var groups = {};
        list.forEach(function (p) {
          var k = ym(p) || '未知时间';
          (groups[k] = groups[k] || []).push(p);
        });
        var keys = Object.keys(groups).sort(function (a, b) { return b.localeCompare(a); });
        var box = document.getElementById('groups');
        if (!list.length) {
          box.innerHTML = '<div class="empty">' + (ts.length ? '没有找到包含这个词的文章。' : '这里还没有文章。') + '</div>';
          return;
        }

        box.innerHTML = keys.map(function (k) {
          var cards = groups[k].map(function (p) {
            var tags = (p.tags || []).map(function (t) {
              return '<span class="tag">' + esc(t) + '</span>';
            }).join('');

            var body = '';
            if (ts.length) {
              var snip = snippetOf(p, ts);
              if (snip) body = '<span class="arc-snippet">' + mark(snip, ts) + '</span>';
              else if (p.desc) body = '<span class="arc-desc">' + mark(p.desc, ts) + '</span>';
            } else if (p.desc) {
              body = '<span class="arc-desc">' + esc(p.desc) + '</span>';
            }

            var day = p.date ? p.date.slice(8, 10) : '—';
            return '<li class="arc">' +
              '<a href="post.html?post=' + encodeURIComponent(p.slug) + '">' +
                '<span class="arc-date">' + esc(day) + '</span>' +
                '<span class="arc-main">' +
                  '<span class="arc-title">' + (ts.length ? mark(p.title || p.slug, ts) : esc(p.title || p.slug)) + '</span>' +
                  body +
                  (tags ? '<span class="arc-tags">' + tags + '</span>' : '') +
                '</span>' +
                '<span class="arc-arrow" aria-hidden="true">→</span>' +
              '</a>' +
            '</li>';
          }).join('');

          var label = k === '未知时间' ? k : k.replace('-', ' / ');
          return '<section class="month">' +
            '<h2 class="month-head"><span class="month-label">' + esc(label) + '</span>' +
            '<span class="month-line"></span><span class="month-count">' + groups[k].length + ' 篇</span></h2>' +
            '<ul class="arc-list">' + cards + '</ul>' +
          '</section>';
        }).join('');
      }

      function bindTags() {
        document.getElementById('tagList').addEventListener('click', function (e) {
          var btn = e.target.closest ? e.target.closest('.tag-row') : null;
          if (!btn) return;
          var t = btn.getAttribute('data-tag');
          activeTag = (activeTag === t) ? null : t;
          renderTagList();
          renderGroups();
        });
      }

      function bindSearch() {
        var input = document.getElementById('searchInput');
        var clear = document.getElementById('searchClear');
        var timer = null;

        function syncUrl() {
          var q = query.trim();
          var url = q ? '?q=' + encodeURIComponent(q) : location.pathname;
          if (window.history && history.replaceState) history.replaceState(null, '', url);
        }
        function apply(v) {
          query = v;
          clear.hidden = !v;
          if (timer) clearTimeout(timer);
          timer = setTimeout(function () { renderGroups(); syncUrl(); }, 140);
        }

        input.value = query;
        clear.hidden = !query;
        input.addEventListener('input', function () { apply(input.value); });
        input.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') { input.value = ''; apply(''); }
        });
        clear.addEventListener('click', function () { input.value = ''; apply(''); input.focus(); });
      }

      load()
        .then(function () {
          document.getElementById('status').style.display = 'none';
          renderSummary();
          renderTagList();
          renderTimeSelect();
          renderGroups();
          bindTags();
          bindSearch();
          document.getElementById('monthSelect').addEventListener('change', function () {
            activeMonth = this.value;
            renderGroups();
          });
        })
        .catch(function (err) {
          var st = document.getElementById('status');
          st.textContent = '文章没读出来（' + err.message + '）。如果是本地直接打开的，请用本地服务器访问。';
          st.style.color = 'var(--accent)';
        });

      var yEl = document.getElementById('year');
      if (yEl) yEl.textContent = new Date().getFullYear();
    })();
  </script>

  <script src="assets/backtop.js?v=1"></script>
  <script src="assets/search.js?v=1"></script>
</body>
</html>
