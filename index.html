<body>
  <header class="masthead">
    <div class="masthead-in">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="assets/xiaotang27-logo.webp" alt="" width="26" height="26" />
        <span class="brand-name">Xiaotang27</span>

      <nav class="nav" aria-label="站点导航">
        <a href="index.html" aria-current="page">主页</a>
        <a href="blog.html">文章</a>
        <a href="friends.html">友链</a>
        <a href="post.html?post=about">关于</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="hero" aria-labelledby="heroTitle">
        <div class="hero-top">
          <p class="eyebrow">Xiaotang27 / 个人网站</p>
          <p class="hero-updated">最近更新 <time id="lastUpdated">—</time></p>
        </div>
        <h1 class="hero-title" id="heroTitle">丢掉幻想，<br /><span class="l2">准备斗争<span class="accent">。</span></span></h1>
      </section>

      <div class="home-grid">
        <section class="contents" id="recent" aria-labelledby="recentTitle">
          <div class="sec-head">
            <h2 class="sec-title" id="recentTitle"><span class="sec-no">01</span>最近写的</h2>
            <a class="sec-link" href="blog.html">全部 <span id="postCount">—</span> 篇 →</a>
          </div>

          <p class="status" id="status">正在读取文章…</p>
          <noscript><p class="status">文章列表需要 JavaScript 才能读取。</p></noscript>
          <ol class="index" id="postList"></ol>
        </section>

        <aside class="rail" aria-label="站点链接与附记">
          <div class="rail-block">
            <h2 class="rail-title">在别处</h2>
            <ul class="outlinks">
              <li><a href="https://github.com/xiaotang27" target="_blank" rel="noopener noreferrer">GitHub<span aria-hidden="true">↗</span></a></li>
              <li><a href="https://space.bilibili.com/1473734923" target="_blank" rel="noopener noreferrer">哔哩哔哩<span aria-hidden="true">↗</span></a></li>
              <li><a href="https://tangible.xiaotang27.top" target="_blank" rel="noopener noreferrer">TangibleCraft<span aria-hidden="true">↗</span></a></li>
              <li><a href="https://modrinth.com/organization/trtimc" target="_blank" rel="noopener noreferrer">Modrinth<span aria-hidden="true">↗</span></a></li>
            </ul>
          </div>

          <div class="rail-block rail-note">
            <h2 class="rail-title">附记</h2>
            <p class="note-kicker">距离 2028 年高考还有</p>
            <p class="gaokao"><b id="gaokaoDays">—</b><span>天</span></p>
            <p class="note-fine">2028.06.07 · 09:00</p>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="site-foot">
    <div class="foot-in">
      <p>© <span id="year">2026</span> Xiaotang27 · 保留所有权利 · <a href="https://icp.gov.moe/?keyword=20265735" target="_blank" rel="noopener">萌ICP备20265735号</a></p>
    </div>
  </footer>

  <script src="assets/markdown.js?v=1"></script>
  <script>
    (function () {
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function dotted(d) { return String(d || '').replace(/-/g, '.'); }
      function lastModifiedDate(res) {
        var lm = res && res.headers && res.headers.get('Last-Modified');
        if (!lm) return '';
        var d = new Date(lm);
        return isNaN(d) ? '' : d.toISOString().slice(0, 10);
      }
      function pad(n) { return (n < 10 ? '0' : '') + n; }

      function loadPosts() {
        return fetch('posts/index.json')
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (data) {
            var posts = (data.posts || []).slice();
            return Promise.all(posts.map(function (p) {
              return fetch('posts/' + encodeURIComponent(p.slug) + '.md')
                .then(function (res) {
                  var d = lastModifiedDate(res);
                  return res.text().then(function (md) {
                    p.date = p.date || d;
                    p.words = countWords(md.replace(/^#\s+[^\n]*\n?/, ''));
                    p.readMin = readMinutes(p.words);
                    return p;
                  });
                })
                .catch(function () { p.words = 0; p.readMin = 1; return p; });
            }));
          })
          .then(function (posts) {
            posts.sort(function (a, b) {
              return String(b.date || '').localeCompare(String(a.date || ''));
            });
            return posts;
          });
      }

      function entry(p, i) {
        var tag = (p.tags && p.tags[0]) ? '<span class="sep">/</span><span class="entry-tag">#' + esc(p.tags[0]) + '</span>' : '';
        return '<li class="entry">' +
          '<a href="post.html?post=' + encodeURIComponent(p.slug) + '">' +
            '<span class="entry-no">' + pad(i + 1) + '</span>' +
            '<span class="entry-body">' +
              '<span class="entry-title">' + esc(p.title || p.slug) + '</span>' +
              '<span class="entry-sub">' +
                '<span>' + esc(dotted(p.date || '日期未知')) + '</span>' +
                '<span class="sep">/</span><span>约 ' + formatWords(p.words) + '</span>' +
                '<span class="sep">/</span><span>' + p.readMin + ' 分钟</span>' +
                tag +
              '</span>' +
            '</span>' +
            '<span class="entry-arrow" aria-hidden="true">→</span>' +
          '</a>' +
        '</li>';
      }

      loadPosts()
        .then(function (posts) {
          document.getElementById('status').style.display = 'none';
          document.getElementById('postCount').textContent = posts.length;
          document.getElementById('postList').innerHTML = posts.slice(0, 5).map(entry).join('');

          var latest = posts[0] && posts[0].date;
          if (latest) {
            var t = document.getElementById('lastUpdated');
            t.textContent = dotted(latest);
            t.setAttribute('datetime', latest);
          }
        })
        .catch(function (err) {
          var st = document.getElementById('status');
          st.textContent = '文章没读出来（' + err.message + '）。如果是本地直接打开的，请用本地服务器访问。';
          st.style.color = 'var(--accent)';
        });

      (function () {
        var target = new Date('2028-06-07T09:00:00+08:00');
        var el = document.getElementById('gaokaoDays');
        if (!el) return;
        function tick() {
          var diff = target.getTime() - Date.now();
          el.textContent = Math.max(0, Math.ceil(diff / 86400000));
        }
        tick();
        setInterval(tick, 60000);
      })();

      var yEl = document.getElementById('year');
      if (yEl) yEl.textContent = new Date().getFullYear();
    })();
  </script>

  <script src="assets/backtop.js?v=1"></script>
  <script src="assets/search.js?v=1"></script>
</body>
</html>
