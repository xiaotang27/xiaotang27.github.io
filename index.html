<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Xiaotang27 的个人主页：丢掉幻想，准备斗争。" />
  <meta name="theme-color" content="#667eea" />
  <title>Xiaotang27's Blog</title>
  <link rel="icon" type="image/svg+xml" href="xiaotang27-logo.webp" />
  <style>
    /* ============ 基础 ============ */
    :root {
      --bg: #f5f6fb;
      --glass-bg: rgba(255, 255, 255, 0.6);
      --glass-line: rgba(28, 32, 48, 0.08);
      --card: rgba(255, 255, 255, 0.8);
      --card-border: rgba(255, 255, 255, 0.9);
      --text: #1c2030;
      --text-soft: #5b6472;
      --text-faint: #9aa1b0;
      --rule: rgba(102, 126, 234, 0.16);
      --btn-bg: #ffffff;
      --btn-border: #e6e8f2;
      --shadow: 0 24px 70px -18px rgba(88, 96, 170, 0.3);
      --accent-1: #667eea;
      --accent-2: #764ba2;
      --accent-3: #f093fb;
      --badge-bg: #ffffff;
      --band-h: 64px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
        "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ============ 背景光斑 ============ */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
    .blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; }
    .b1 {
      width: 520px; height: 520px; left: -140px; top: -160px;
      background: radial-gradient(circle at 30% 30%, var(--accent-1), transparent 70%);
      animation: drift 18s ease-in-out infinite alternate;
    }
    .b2 {
      width: 460px; height: 460px; right: -120px; bottom: -140px;
      background: radial-gradient(circle at 60% 40%, var(--accent-3), transparent 70%);
      animation: drift 22s ease-in-out infinite alternate-reverse;
    }
    .b3 {
      width: 320px; height: 320px; left: 46%; top: 55%;
      background: radial-gradient(circle at 50% 50%, var(--accent-2), transparent 70%);
      opacity: 0.32;
      animation: drift 26s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to   { transform: translate3d(40px, -30px, 0) scale(1.12); }
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============ 顶部毛玻璃区域 ============ */
    .glass {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--band-h);
      z-index: 100;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      backdrop-filter: blur(18px) saturate(170%);
      border-bottom: 1px solid var(--glass-line);
    }
    .glass-inner {
      max-width: 1080px;
      height: 100%;
      margin: 0 auto;
      padding: 0 22px;
      display: flex;
      align-items: center;
    }

    /* 迷你资料卡：默认隐藏，资料卡片完全进入毛玻璃区域后淡入 */
    .mini {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(6px);
      visibility: hidden;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
      cursor: pointer;
      user-select: none;
      background: none;
      border: none;
      font-family: inherit;
      color: inherit;
      padding: 0;
    }
    .glass.is-active .mini { opacity: 1; transform: translateY(0); visibility: visible; }
    .mini img {
      width: 42px; height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 4px 12px -3px rgba(80, 90, 160, 0.4);
    }
    .mini-text { display: flex; flex-direction: column; line-height: 1.25; text-align: left; }
    .mini-name { font-size: 16px; font-weight: 800; letter-spacing: .3px; }
    .mini-slogan { font-size: 12px; color: var(--text-soft); margin-top: 2px; letter-spacing: 1px; }

    /* ============ 首屏：个人资料卡（垂直居中） ============ */
    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--band-h) + 24px) 16px 48px;
    }

    .profile {
      width: min(94vw, 680px);
      background: var(--card);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      box-shadow: var(--shadow);
      padding: 52px 48px 44px;
      text-align: center;
      animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* 圆形头像（不拉伸） */
    .pf-avatar {
      width: 148px; height: 148px;
      margin: 0 auto;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 14px 34px -10px rgba(88, 96, 170, 0.5);
      transition: transform 0.35s ease;
    }
    .pf-avatar:hover { transform: scale(1.05); }

    .name {
      margin-top: 24px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(120deg, #23283a, var(--accent-2) 60%, var(--accent-3));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: var(--text); /* 兜底 */
    }
    .slogan {
      margin-top: 10px;
      color: var(--text-soft);
      font-size: 15.5px;
      line-height: 1.6;
      letter-spacing: 2px;
    }

    /* 按钮：全部同一行 */
    .links { margin-top: 32px; }
    .link-list {
      list-style: none;
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-soft);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 3px 10px -4px rgba(80, 90, 160, 0.18);
      transition: transform 0.22s ease, box-shadow 0.22s ease,
                  color 0.22s ease, border-color 0.22s ease;
    }
    .btn svg { width: 16px; height: 16px; display: block; }
    .badge {
      width: 17px; height: 17px;
      flex: 0 0 17px;
      border-radius: 4px;
      background: var(--badge-bg);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .badge img { width: 13px; height: 13px; object-fit: contain; display: block; }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -8px rgba(80, 90, 160, 0.35); }
    .btn:active { transform: translateY(0); }
    .btn:focus-visible { outline: 2px solid var(--accent-1); outline-offset: 3px; }

    .btn.github:hover   { color: #24292f; border-color: #24292f; }
    .btn.bili:hover     { color: #fb7299; border-color: #fb7299; }
    .btn.tangible:hover { color: #111111; border-color: #111111; }
    .btn.modrinth:hover { color: #00af5c; border-color: #00af5c; }

    /* 向下滑动的提示 */
    .scroll-hint {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      color: var(--text-faint);
      font-size: 12.5px;
      letter-spacing: 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      animation: hint 2s ease-in-out infinite;
    }
    .scroll-hint svg { width: 16px; height: 16px; }
    @keyframes hint {
      0%, 100% { transform: translate(-50%, 0); opacity: 0.85; }
      50%      { transform: translate(-50%, 8px); opacity: 0.4; }
    }

    /* ============ 博客区（独立于资料卡） ============ */
    .blog-section { padding: 20px 16px 70px; scroll-margin-top: calc(var(--band-h) + 16px); }
    .blog-card {
      max-width: 760px;
      margin: 0 auto;
      background: var(--card);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 38px 38px 44px;
    }
    .blog-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }
    .blog-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(120deg, var(--accent-2), var(--accent-3));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .blog-count { color: var(--text-faint); font-size: 13px; }
    .status { color: var(--text-faint); font-size: 14px; text-align: center; padding: 26px 0; }

    .post-list { list-style: none; display: flex; flex-direction: column; gap: 22px; }
    .post-card {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 20px;
      box-shadow: 0 8px 22px -12px rgba(80, 90, 160, 0.22);
      overflow: hidden;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .post-card:hover { transform: translateY(-3px); box-shadow: 0 16px 30px -14px rgba(80, 90, 160, 0.35); }
    .post-card a { display: block; color: inherit; text-decoration: none; }

    /* 头图位 */
    .cover { aspect-ratio: 4.4 / 1; background: #e9ebf5; }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-ph {
      width: 100%; height: 100%;
      background: linear-gradient(120deg, #7b8ff0 0%, var(--accent-2) 52%, var(--accent-3) 100%);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255, 255, 255, 0.8);
    }
    .cover-ph svg { width: 34px; height: 34px; }

    .post-body { padding: 18px 24px 20px; }
    .post-title { font-size: 19px; font-weight: 700; letter-spacing: 0.3px; }
    .post-meta {
      margin-top: 8px; color: var(--text-faint); font-size: 13px;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    .post-desc { margin-top: 8px; color: var(--text-soft); font-size: 14px; }
    .post-tags { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 7px; }
    .tag {
      font-size: 12px; font-weight: 600;
      color: var(--accent-2);
      background: rgba(118, 75, 162, 0.1);
      padding: 3px 10px; border-radius: 999px;
    }

    footer {
      text-align: center;
      color: var(--text-faint);
      font-size: 13px;
      letter-spacing: 0.3px;
      padding: 0 16px 34px;
    }

    /* ============ 深色模式 ============ */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1118;
        --glass-bg: rgba(15, 17, 24, 0.6);
        --glass-line: rgba(255, 255, 255, 0.08);
        --card: rgba(23, 26, 38, 0.75);
        --card-border: rgba(255, 255, 255, 0.08);
        --text: #eef0f7;
        --text-soft: #a7adc0;
        --text-faint: #666c7e;
        --rule: rgba(160, 174, 255, 0.18);
        --btn-bg: rgba(255, 255, 255, 0.06);
        --btn-border: rgba(255, 255, 255, 0.12);
        --shadow: 0 24px 70px -18px rgba(0, 0, 0, 0.6);
      }
      .name {
        background: linear-gradient(120deg, #ffffff, var(--accent-1) 55%, var(--accent-3));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .btn.github:hover   { color: #ffffff; border-color: #ffffff; }
      .btn.tangible:hover { color: #ffffff; border-color: #ffffff; }
      .tag { background: rgba(160, 174, 255, 0.14); color: #c3c9ff; }
      .cover { background: #1a1d29; }
      .glass { border-bottom-color: rgba(255, 255, 255, 0.08); }
    }

    /* ============ 小屏 ============ */
    @media (max-width: 620px) {
      .profile { padding: 40px 22px 34px; }
      .pf-avatar { width: 128px; height: 128px; }
      .name { font-size: 28px; }
      /* 一行放不下时允许换行 */
      .link-list { flex-wrap: wrap; }
      .blog-card { padding: 26px 18px 32px; }
      .scroll-hint { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <script src="assets/markdown.js"></script>
  <script>
    (function () {
      var BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>';

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      function lastModifiedDate(res) {
        var lm = res && res.headers && res.headers.get('Last-Modified');
        if (!lm) return '';
        var d = new Date(lm);
        return isNaN(d) ? '' : d.toISOString().slice(0, 10);
      }

      /* ---------- 博客加载（逻辑与文章页一致） ---------- */
      function loadPosts() {
        return fetch('posts/index.json')
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (data) {
            var posts = (data.posts || []).slice();
            return Promise.all(posts.map(function (p) {
              return fetch('posts/' + encodeURIComponent(p.slug) + '.md')
                .then(function (res) {
                  var d = lastModifiedDate(res);
                  return res.text().then(function (md) {
                    p.date = p.date || d;
                    p.words = countWords(md);
                    p.readMin = readMinutes(p.words);
                    return p;
                  });
                })
                .catch(function () { p.words = 0; p.readMin = 1; return p; });
            }));
          })
          .then(function (posts) {
            posts.sort(function (a, b) {
              if ((b.date || '') !== (a.date || '')) return (b.date || '').localeCompare(a.date || '');
              return 0;
            });
            return posts;
          });
      }

      function card(p, i) {
        var cover;
        if (p.cover) {
          cover = '<img src="' + esc(p.cover) + '" alt="" loading="lazy" />';
        } else {
          cover = '<div class="cover-ph">' + BOOK + '</div>';
        }
        var metaBits = [
          '<span>发布于 ' + (p.date || '未知') + '</span>',
          '<span>约 ' + formatWords(p.words) + '</span>',
          '<span>约 ' + p.readMin + ' 分钟</span>'
        ];
        var tags = (p.tags || []).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
        return (
          '<li class="post-card" style="animation:rise .6s ease both;animation-delay:' + (i * 70) + 'ms">' +
            '<a href="blog/post.html?post=' + encodeURIComponent(p.slug) + '">' +
              '<div class="cover">' + cover + '</div>' +
              '<div class="post-body">' +
                '<h3 class="post-title">' + esc(p.title) + '</h3>' +
                '<div class="post-meta">' + metaBits.join('<span>·</span>') + '</div>' +
                (p.desc ? '<p class="post-desc">' + esc(p.desc) + '</p>' : '') +
                (tags ? '<div class="post-tags">' + tags + '</div>' : '') +
              '</div>' +
            '</a>' +
          '</li>'
        );
      }

      loadPosts()
        .then(function (posts) {
          document.getElementById('status').style.display = 'none';
          document.getElementById('postCount').textContent = posts.length;
          document.getElementById('postList').innerHTML = posts.map(card).join('');
        })
        .catch(function (err) {
          document.getElementById('status').textContent =
            '文章加载失败：' + err.message +
            '。博客需要读取本地文件，请用 HTTP 服务访问（例如 python -m http.server），或部署后浏览。';
        });

      /* ---------- 毛玻璃联动：资料卡完全进入顶栏后显示迷你卡 ---------- */
      var glass = document.getElementById('glass');
      var mini = document.getElementById('mini');
      var profile = document.getElementById('profile');
      var bandH = 64;

      function onScroll() {
        var rect = profile.getBoundingClientRect();
        // 资料卡顶边进入顶栏底边之下 -> 视为已完全进入毛玻璃区域
        var fullyIn = rect.bottom <= bandH;
        glass.classList.toggle('is-active', fullyIn);
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      mini.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      var yEl = document.getElementById('year');
      if (yEl) yEl.textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
