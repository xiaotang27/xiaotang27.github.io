<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Xiaotang27 的文章。" />
  <meta name="theme-color" content="#f4f0e6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
  <title>文章 · Xiaotang27</title>
  <link rel="icon" type="image/webp" href="xiaotang27-logo.webp" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="assets/site.css?v=1" />
  <script src="assets/theme.js?v=1"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-in">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="assets/xiaotang27-logo.webp" alt="" width="26" height="26" />
        <span class="brand-name">Xiaotang27</span>
      </a>
      <nav class="nav" aria-label="站点导航">
        <a href="index.html">主页</a>
        <a href="blog.html">文章</a>
        <a href="friends.html">友链</a>
        <a href="post.html?post=about" id="navAbout">关于</a>
      </nav>
      <div class="nav-actions" id="navActions"></div>
    </div>
  </header>

  <main class="article-wrap">
    <p class="crumbs"><a href="blog.html">文章</a><span class="slash">/</span><span class="here" id="crumb">正文</span></p>

    <p class="status" id="status">正在读取文章…</p>
    <noscript><p class="status">文章正文需要 JavaScript 才能读取。</p></noscript>

    <div id="wrap" hidden>
      <header class="article-head">
        <h1 class="article-title" id="title"></h1>
        <div class="article-meta">
          <span id="date"></span>
          <span id="words"></span>
          <span id="readTime"></span>
          <span class="tags" id="tags"></span>
        </div>
      </header>

      <div class="article-cover" id="cover" hidden></div>

      <article class="prose" id="content"></article>

      <div class="end-mark" aria-hidden="true"></div>
      <nav class="pager" id="pager" aria-label="上一篇与下一篇" hidden></nav>
    </div>
  </main>

  <footer class="site-foot">
    <div class="foot-in">
      <p>© <span id="year">2026</span> Xiaotang27 · 保留所有权利 · <a href="https://icp.gov.moe/?keyword=20265735" target="_blank" rel="noopener">萌ICP备20265735号</a></p>
    </div>
  </footer>

  <script src="assets/markdown.js?v=1"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var slug = params.get('post');
      var statusEl = document.getElementById('status');

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function dotted(d) { return String(d || '').replace(/-/g, '.'); }
      function lastModifiedDate(res) {
        var lm = res && res.headers && res.headers.get('Last-Modified');
        if (!lm) return '';
        var d = new Date(lm);
        return isNaN(d) ? '' : d.toISOString().slice(0, 10);
      }

      function fail(msg) {
        statusEl.innerHTML = '没有找到这篇文章。' + (msg ? '（' + esc(msg) + '）' : '') +
          '<br /><a href="blog.html">回文章列表 →</a>' +
          (location.protocol === 'file:' ? '<br />本地直接打开时，请用 HTTP 服务访问。' : '');
      }

      if (!slug) { fail('地址里没有 ?post= 参数'); return; }

      if (slug === 'about') {
        var ab = document.getElementById('navAbout');
        if (ab) ab.setAttribute('aria-current', 'page');
      }

      Promise.all([
        fetch('posts/index.json').then(function (r) { return r.ok ? r.json() : { posts: [] }; }),
        fetch('posts/' + encodeURIComponent(slug) + '.md').then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          var lm = lastModifiedDate(r);
          return r.text().then(function (t) { return { md: t, lastMod: lm }; });
        })
      ]).then(function (res) {
        var data = res[0] || {};
        var meta = null;
        (data.posts || []).forEach(function (p) { if (p.slug === slug) meta = p; });

        var md = res[1].md;
        var lastMod = res[1].lastMod;
        md = md.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');
        if (meta) md = md.replace(/^#\s+[^\n]*\n?/, '');

        var title = (meta && meta.title) || slug;
        document.title = title + ' · Xiaotang27';

        var words = countWords(md);
        var mins = readMinutes(words);
        var date = (meta && meta.date) || lastMod;

        document.getElementById('title').textContent = title;
        document.getElementById('crumb').textContent = title;
        document.getElementById('date').textContent = date ? '发布于 ' + dotted(date) : '日期未知';
        document.getElementById('words').textContent = '约 ' + formatWords(words);
        document.getElementById('readTime').textContent = '约 ' + mins + ' 分钟读完';
        document.getElementById('tags').innerHTML = ((meta && meta.tags) || []).map(function (t) {
          return '<span class="tag">' + esc(t) + '</span>';
        }).join('');

        if (meta && meta.cover) {
          var coverEl = document.getElementById('cover');
          coverEl.innerHTML = '<img src="' + esc(meta.cover) + '" alt="' + esc(title) + '" />';
          coverEl.hidden = false;
        }

        document.getElementById('content').innerHTML = renderMarkdown(md);

        /* 上一篇 / 下一篇：按日期倒序，左边更早，右边更新 */
        var ordered = (data.posts || []).slice().sort(function (a, b) {
          return String(b.date || '').localeCompare(String(a.date || ''));
        });
        var idx = -1;
        for (var i = 0; i < ordered.length; i++) { if (ordered[i].slug === slug) { idx = i; break; } }
        if (idx > -1) {
          var newer = idx > 0 ? ordered[idx - 1] : null;
          var older = idx < ordered.length - 1 ? ordered[idx + 1] : null;
          var pager = document.getElementById('pager');
          var html = '';
          if (older) {
            html += '<a class="pager-prev" href="post.html?post=' + encodeURIComponent(older.slug) + '">' +
              '<span class="pager-label">← 更早</span>' +
              '<span class="pager-title">' + esc(older.title) + '</span></a>';
          }
          if (newer) {
            html += '<a class="pager-next" href="post.html?post=' + encodeURIComponent(newer.slug) + '">' +
              '<span class="pager-label">更新 →</span>' +
              '<span class="pager-title">' + esc(newer.title) + '</span></a>';
          }
          if (html) {
            pager.innerHTML = html;
            pager.hidden = false;
          }
        }

        statusEl.style.display = 'none';
        document.getElementById('wrap').hidden = false;
      }).catch(function (err) {
        fail(err.message);
      });

      var yEl = document.getElementById('year');
      if (yEl) yEl.textContent = new Date().getFullYear();
    })();
  </script>

  <script src="assets/backtop.js?v=1"></script>
  <script src="assets/search.js?v=1"></script>
</body>
</html>
